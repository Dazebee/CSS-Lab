<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First CSS Page</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        h1 {
            color: DarkBlue;
            text-align: center;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: lightgray;
        }

            line-height: 1.5;
        }

<body>

</body>
</html>
